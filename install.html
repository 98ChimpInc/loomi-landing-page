<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Install Loomi</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./android-chrome-512x512.png">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VMFQHMVH6N"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-VMFQHMVH6N');
    </script>

    <!-- Platform-aware redirect. iPhone goes to the App Store, Android to
         Google Play, and a desktop visitor is shown both badges and redirected
         nowhere, because a store page is not useful on a laptop. Each URL is
         validated before use, so a placeholder never becomes a redirect to a
         broken page. -->
    <script>
        (function () {
            var APP_STORE_URL  = "https://apps.apple.com/app/loomi-sleep-stories-for-kids/id6757821754";
            var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.chimp98.loomi";

            var ua = navigator.userAgent || "";
            var isAndroid = /android/i.test(ua);
            var isApple = /iPhone|iPad|iPod/i.test(ua);
            var target = isAndroid ? PLAY_STORE_URL : isApple ? APP_STORE_URL : null;

            var isRealStoreUrl = target !== null && (
                /^https:\/\/apps\.apple\.com\//.test(target) ||
                /^https:\/\/play\.google\.com\//.test(target)
            );

            // Desktop, or a placeholder URL: show the card, redirect nowhere.
            if (!isRealStoreUrl) { return; }

            var m = document.createElement("meta");
            m.httpEquiv = "refresh";
            m.content = "1; url=" + target;
            document.head.appendChild(m);

            if (typeof gtag !== "undefined") {
                gtag("event", "install_redirect", {
                    "event_category": "engagement",
                    "event_label": isAndroid ? "install_to_play_store" : "install_to_app_store"
                });
            }

            setTimeout(function () { window.location.replace(target); }, 800);
        })();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #0a0e1f 0%, #141b2d 50%, #1a2332 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .redirect-card {
            max-width: 520px;
            padding: 48px 32px;
            background: rgba(10, 14, 31, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        .redirect-card img.logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 24px;
        }

        .redirect-card h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .redirect-card p {
            color: #a5b4fc;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .redirect-card .app-store-link {
            display: inline-block;
            transition: transform 0.25s ease;
            line-height: 0;
        }

        .redirect-card .app-store-link:hover {
            transform: translateY(-2px);
        }

        .redirect-card .app-store-link img {
            height: 56px;
            width: auto;
            display: block;
        }

        .redirect-note {
            margin-top: 24px;
            color: #8b9dc3;
            font-size: 13px;
        }

        .redirect-note a {
            color: #c7d2fe;
            text-decoration: underline;
        }

        .store-links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <main class="redirect-card">
        <img class="logo" src="./apple-touch-icon.png" alt="Loomi">
        <h1>Get Loomi</h1>
        <p>Taking you to your app store now...</p>
        <div class="store-links">
            <a class="app-store-link" href="https://apps.apple.com/app/loomi-sleep-stories-for-kids/id6757821754" aria-label="Download Loomi on the App Store">
                <img src="./assets/app-store-badge.svg" alt="Download on the App Store">
            </a>
            <a class="app-store-link" href="https://play.google.com/store/apps/details?id=com.chimp98.loomi" aria-label="Get Loomi on Google Play">
                <img src="./assets/google-play-badge.svg" alt="Get it on Google Play">
            </a>
        </div>
        <p class="redirect-note">Not redirecting? Choose your store above.</p>
    </main>

    <noscript>
        <!-- The meta refresh is injected by the script above, so with JS off
             nothing redirects and the badges are the whole path. -->
        <p style="text-align:center;color:#a5b4fc;font-family:'Fredoka',sans-serif;">
            JavaScript is off ... choose your store above to install Loomi.
        </p>
    </noscript>
</body>
</html>
